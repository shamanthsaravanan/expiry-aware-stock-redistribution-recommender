<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Redistribution Recommender</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <header>
            <div class="logo">
                <div class="logo-icon"></div>
                <h1>Recommender</h1>
            </div>
            <div class="user-info">Pharmacist On Duty</div>
        </header>
        
        <main>
            <section class="metrics-grid">
                <div class="metric-card glass">
                    <h3>Total Inventory Value</h3>
                    <p id="tiv" class="metric-value">Loading...</p>
                </div>
                <div class="metric-card glass warning">
                    <h3>Value At Risk (<= 14 days)</h3>
                    <p id="var" class="metric-value">Loading...</p>
                </div>
                <div class="metric-card glass danger">
                    <h3>Projected Waste</h3>
                    <p id="pw" class="metric-value">Loading...</p>
                </div>
                <div class="metric-card glass success">
                    <h3>Potential Savings (Recommended)</h3>
                    <p id="ps" class="metric-value">Loading...</p>
                </div>
            </section>

            <section class="recommendations">
                <h2>Pending Transfers</h2>
                <div class="table-container glass">
                    <table id="recs-table">
                        <thead>
                            <tr>
                                <th>Medicine</th>
                                <th>Batch ID</th>
                                <th>From -> To</th>
                                <th>Qty</th>
                                <th>Value Saved</th>
                                <th>Impact</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="recs-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        
        <!-- Confirmation Modal -->
        <div id="modal" class="modal hidden">
            <div class="modal-content glass">
                <h3 id="modal-title">Confirm Transfer</h3>
                <p id="modal-desc"></p>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-primary" onclick="approveTransfer()">Approve</button>
                    <button class="btn btn-danger" onclick="rejectTransfer()">Reject (Override)</button>
                </div>
                
                <div id="override-section" class="hidden">
                    <label>Reason for rejection:</label>
                    <select id="override-reason">
                        <option>Clinical Hold</option>
                        <option>Stock Count Mismatch</option>
                        <option>Alternative Plan Exists</option>
                    </select>
                    <button class="btn btn-danger" onclick="submitReject()">Submit</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Data generated by python script -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
